# Server-side backstop for the pre-commit hook in .githooks/.
#
# The local hook only protects contributors who ran `git config core.hooksPath .githooks`.
# This runs for everyone, including pull requests from forks, so an unconfigured clone
# cannot quietly land a credential on main.
#
# It is a backstop, not the primary defence: by the time this fails, the commit already
# exists on GitHub. The primary defences are the local hook and GitHub push protection.
# If this job ever fails on a real credential, rotate it -- deleting the commit does not
# undo the exposure.
name: secret-scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    name: scan for secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the scan sees every commit the PR introduces, not just the tip.
          fetch-depth: 0

      - name: Run scan-secrets.sh
        run: |
          chmod +x scripts/scan-secrets.sh
          bash scripts/scan-secrets.sh

      - name: Scan each commit introduced by this pull request
        if: github.event_name == 'pull_request'
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          echo "Scanning commits ${base}..${head}"
          fail=0
          for c in $(git rev-list "${base}..${head}"); do
            # Check the tree at each commit, so a secret added then deleted in a later
            # commit is still caught -- it remains in history and must still be rotated.
            git checkout -q "$c" -- . 2>/dev/null || true
            if ! bash scripts/scan-secrets.sh >/dev/null 2>&1; then
              echo "::error::commit $c introduces a secret"
              bash scripts/scan-secrets.sh || true
              fail=1
            fi
          done
          git checkout -q "${head}" -- . 2>/dev/null || true
          exit $fail
