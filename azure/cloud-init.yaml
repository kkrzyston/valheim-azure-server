#cloud-config
package_update: true
package_upgrade: false
timezone: America/Los_Angeles
packages: [software-properties-common, ca-certificates, curl]

write_files:
  - path: /etc/systemd/system/valheim.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Valheim Dedicated Server (1g49ye / Vancouver Island)
      Wants=network-online.target
      After=network-online.target
      ConditionPathExists=/home/valheim/data/.world-migrated
      StartLimitIntervalSec=600
      StartLimitBurst=5

      [Service]
      Type=simple
      User=valheim
      Group=valheim
      WorkingDirectory=/home/valheim/server
      Environment=HOME=/home/valheim
      Environment=SteamAppId=892970
      Environment=LD_LIBRARY_PATH=/home/valheim/server/linux64
      ExecStartPre=-/usr/games/steamcmd +force_install_dir /home/valheim/server +login anonymous +app_update 896660 +quit
      ExecStart=/home/valheim/server/valheim_server.x86_64 -nographics -batchmode -name "1g49ye" -port 2456 -world "Vancouver Island" -password "hammerhead" -modifier raids more -savedir /home/valheim/data -backups 4 -backupshort 7200 -backuplong 43200
      KillSignal=SIGINT
      KillMode=mixed
      TimeoutStopSec=180
      TimeoutStartSec=900
      Restart=on-failure
      RestartSec=15
      LimitNOFILE=100000

      [Install]
      WantedBy=multi-user.target

  - path: /etc/systemd/system/valheim-update.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Valheim: update to Steam's current build if one is pending and nobody is playing
      After=network-online.target

      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/valheim-autoupdate.sh

  - path: /etc/systemd/system/valheim-update.timer
    permissions: '0644'
    content: |
      [Unit]
      Description=Check Steam for a Valheim server update every 30 minutes

      [Timer]
      OnBootSec=10min
      OnUnitActiveSec=30min
      RandomizedDelaySec=2min
      Persistent=false

      [Install]
      WantedBy=timers.target

  - path: /usr/local/sbin/valheim-autoupdate.sh
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      # valheim-autoupdate.sh -- keep the Valheim dedicated server on Steam's current public build.
      #
      #   sudo /usr/local/sbin/valheim-autoupdate.sh          # update only if nobody is connected
      #   sudo /usr/local/sbin/valheim-autoupdate.sh --force  # manual only: update even with players online
      #
      # Run by valheim-update.timer every 30 min. Nothing ever schedules --force (owner's rule: never force an update).
      # Logs to the journal (unit tag "valheim-autoupdate") and /var/log/valheim-autoupdate.log.
      set -uo pipefail

      APPID=896660
      SERVER=/home/valheim/server
      MANIFEST="$SERVER/steamapps/appmanifest_${APPID}.acf"
      STEAMCMD=/usr/games/steamcmd
      LOGFILE=/var/log/valheim-autoupdate.log
      FORCE=0
      [ "${1:-}" = "--force" ] && FORCE=1

      log() { echo "$(date '+%F %T') $*" | tee -a "$LOGFILE" | logger -t valheim-autoupdate; }

      installed_build() { grep -oE '"buildid"\s+"[0-9]+"' "$MANIFEST" 2>/dev/null | grep -oE '[0-9]+'; }

      remote_build() {
        # app_info_print sometimes returns nothing on the first call after a cache refresh; try up to 3 times.
        for _ in 1 2 3; do
          local out
          out=$(sudo -u valheim -H "$STEAMCMD" +login anonymous +app_info_update 1 +app_info_print "$APPID" +quit 2>/dev/null \
            | awk '/"branches"/{b=1} b && /"public"/{p=1} p && /"buildid"/{gsub(/"/,"",$2); print $2; exit}')
          if [[ "$out" =~ ^[0-9]+$ ]]; then echo "$out"; return 0; fi
          sleep 10
        done
        return 1
      }

      players() {
        # The server logs " Connections N ZDOS:..." every 10 minutes; take the newest line since the current start.
        local inv
        inv=$(systemctl show valheim -p InvocationID --value)
        journalctl --no-pager "_SYSTEMD_INVOCATION_ID=$inv" 2>/dev/null \
          | grep -oE 'Connections [0-9]+' | tail -n 1 | grep -oE '[0-9]+' || echo 0
      }

      if ! systemctl is-active --quiet valheim; then
        log "valheim.service is not active; leaving it alone (systemctl start runs the Steam update itself)"
        exit 0
      fi

      cur=$(installed_build)
      new=$(remote_build) || { log "could not read Steam's public build id; will retry next run"; exit 0; }

      if [ "$cur" = "$new" ]; then
        log "up to date (build $cur)"
        exit 0
      fi

      n=$(players)
      if [ "$n" != "0" ] && [ "$FORCE" = 0 ]; then
        log "update available ($cur -> $new) but $n player(s) connected; deferring"
        exit 0
      fi

      log "updating $cur -> $new (players: $n, force: $FORCE)"
      /home/valheim/backup.sh >>"$LOGFILE" 2>&1 || log "warning: backup.sh failed, continuing"
      # 'stop' sends SIGINT so the server saves the world; 'start' runs steamcmd app_update via ExecStartPre.
      if ! systemctl restart valheim; then
        log "ERROR: systemctl restart valheim failed: $(systemctl status valheim --no-pager -l | tail -n 5)"
        exit 1
      fi
      sleep 20
      after=$(installed_build)
      if [ "$after" = "$new" ]; then
        log "updated OK; now on build $after ($(systemctl is-active valheim))"
      else
        log "ERROR: restart done but installed build is $after, expected $new"
        exit 1
      fi

  - path: /usr/local/sbin/valheim-setup.sh
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      export DEBIAN_FRONTEND=noninteractive
      APT="apt-get -o DPkg::Lock::Timeout=600 -y"
      trap 'echo "=== valheim-setup FAILED at line $LINENO $(date -Is) ==="; touch /var/lib/valheim-setup.failed' ERR
      echo "=== valheim-setup start $(date -Is) ==="
      id -u valheim >/dev/null 2>&1 || useradd --create-home --home-dir /home/valheim --shell /bin/bash valheim
      if [ ! -f /swapfile ]; then fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile; echo '/swapfile none swap sw 0 0' >> /etc/fstab; fi
      dpkg --add-architecture i386
      add-apt-repository -y multiverse
      echo "steam steam/question select I AGREE"    | debconf-set-selections
      echo "steam steam/license note ''"            | debconf-set-selections
      echo "steamcmd steam/question select I AGREE" | debconf-set-selections
      echo "steamcmd steam/license note ''"         | debconf-set-selections
      $APT update
      $APT install --no-install-recommends steamcmd libatomic1 libpulse-dev libpulse0 libc6:i386 libstdc++6:i386 lib32gcc-s1 lib32stdc++6
      test -x /usr/games/steamcmd
      install -d -o valheim -g valheim -m 0755 /home/valheim/server /home/valheim/data /home/valheim/data/worlds_local /home/valheim/backups
      ok=0
      for i in 1 2 3; do
        if sudo -u valheim -H /usr/games/steamcmd +force_install_dir /home/valheim/server +login anonymous +app_update 896660 validate +quit; then ok=1; break; fi
        echo "steamcmd attempt $i failed; retrying in 20s"; sleep 20
      done
      test "$ok" = 1
      test -x /home/valheim/server/valheim_server.x86_64
      grep -E '"buildid"|"name"' /home/valheim/server/steamapps/appmanifest_896660.acf || true
      install -d -o valheim -g valheim /home/valheim/.steam/sdk64
      ln -sf /home/valheim/server/linux64/steamclient.so /home/valheim/.steam/sdk64/steamclient.so
      printf 'Steam_76561198185349471\n' > /home/valheim/data/adminlist.txt
      cat > /home/valheim/update.sh <<'EOF'
      #!/usr/bin/env bash
      set -euo pipefail
      systemctl stop valheim
      sudo -u valheim -H /usr/games/steamcmd +force_install_dir /home/valheim/server +login anonymous +app_update 896660 validate +quit
      grep '"buildid"' /home/valheim/server/steamapps/appmanifest_896660.acf
      systemctl start valheim
      EOF
      cat > /home/valheim/backup.sh <<'EOF'
      #!/usr/bin/env bash
      set -euo pipefail
      ts=$(date +%Y%m%d-%H%M%S)
      tar -czf "/home/valheim/backups/vancouver-island-$ts.tgz" -C /home/valheim/data/worlds_local "Vancouver Island"
      ls -lh /home/valheim/backups | tail -n 5
      EOF
      chmod 755 /home/valheim/update.sh /home/valheim/backup.sh
      chown -R valheim:valheim /home/valheim
      systemctl daemon-reload
      systemctl enable valheim.service
      systemctl enable valheim-update.timer
      touch /home/valheim/.setup-done
      chown valheim:valheim /home/valheim/.setup-done
      echo "=== valheim-setup done $(date -Is) ==="

runcmd:
  - [ bash, -c, "/usr/local/sbin/valheim-setup.sh >> /var/log/valheim-setup.log 2>&1" ]
final_message: "cloud-init finished after $UPTIME seconds"
